<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pix2Text MFR Web Demo</title>
  </head>
  <body>
    <main>
      <h1>Pix2Text MFR-1.5</h1>
      <p>Recognize a formula locally in your browser. Select or paste an image.</p>
      <label>
        Formula image
        <input id="formula-image" type="file" accept="image/*" />
      </label>
      <button id="recognize" type="button" disabled>Recognize</button>
      <p id="backend" hidden></p>
      <p id="status" role="status">Choose an image to begin.</p>
      <div class="result-header">
        <button id="copy-result" type="button" aria-label="Copy result" title="Copy result" disabled>
          <svg class="copy-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-linejoin="round" stroke-width="3">
              <path stroke-linecap="round" d="M13 12.432v-4.62A2.813 2.813 0 0 1 15.813 5h24.374A2.813 2.813 0 0 1 43 7.813v24.375A2.813 2.813 0 0 1 40.187 35h-4.67"></path>
              <path d="M32.188 13H7.811A2.813 2.813 0 0 0 5 15.813v24.374A2.813 2.813 0 0 0 7.813 43h24.375A2.813 2.813 0 0 0 35 40.187V15.814A2.813 2.813 0 0 0 32.187 13Z"></path>
            </g>
          </svg>
          <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
      <pre id="result"></pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
